name: Autonomous AI Recovery Sweep

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours (matches Vercel cron)
  workflow_dispatch: # manual trigger

jobs:
  run-recovery-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production

    steps:
      - name: Trigger AI Recovery Sweep via API
        env:
          SITE_URL: ${{ secrets.SITE_URL || vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || vars.CRON_SECRET }}
        run: |
          if [ -z "${SITE_URL}" ]; then
            echo "::error::Missing SITE_URL. Configure SITE_URL as a GitHub secret/variable."
            exit 1
          fi
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::Missing CRON_SECRET. Configure CRON_SECRET as a GitHub secret/variable and set the same value in the hosting env."
            exit 1
          fi

          API_URL="${SITE_URL%/}/api/ai/recovery"
          echo "Triggering AI recovery sweep at ${API_URL} ..."

          HTTP_STATUS=$(curl -s -o /tmp/recovery_response.json -w "%{http_code}" \
            --max-time 120 \
            -X GET "${API_URL}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "x-cron-secret: ${CRON_SECRET}")

          echo "HTTP Status: ${HTTP_STATUS}"
          echo "Response body:"
          cat /tmp/recovery_response.json || true
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::AI recovery sweep returned HTTP ${HTTP_STATUS}"
            exit 1
          fi
          echo "AI recovery sweep completed successfully."

      - name: Notify on failure
        if: failure()
        env:
          SITE_URL: ${{ secrets.SITE_URL || vars.SITE_URL }}
        run: |
          if [ -n "${SITE_URL}" ]; then
            echo "::error::Autonomous AI recovery sweep failed. Check logs at ${SITE_URL%/}/api/ai/recovery"
          else
            echo "::error::Autonomous AI recovery sweep failed. SITE_URL is not configured."
          fi